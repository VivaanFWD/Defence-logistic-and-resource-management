<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('User Details - Defence Logistics')}"></head><body><div class="d-flex"><div th:replace="~{fragments/layout :: sidebar('users')}"></div><main class="flex-grow-1"><header th:replace="~{fragments/layout :: header(${formTitle}, ${currentUser})}"></header><div class="container px-4 pb-5"><div class="alert alert-info">User creation and role changes must be persisted by the identity/user API. This form sends the fields to Resource_Service; configure its endpoint to match your implementation.</div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="@{/admin/users/save}" method="post"><input type="hidden" name="id" th:value="${recordId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="fullName" required th:value="${record != null ? record.fullName : ''}"></div><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" required th:value="${record != null ? record.username : ''}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required th:value="${record != null ? record.email : ''}"></div><div class="col-md-6"><label class="form-label">Role</label><select class="form-select" name="role"><option value="GUEST">Guest</option><option value="ADMIN">Administrator</option><option value="LOGISTIC_OFFICER">Logistics Officer</option><option value="QUARTERMASTER">Quartermaster / Unit Personnel</option></select></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option>Pending</option><option>Active</option><option>Disabled</option></select></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save user</button><a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a></div></form></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
