spring.application.name=defence-logistics-web
server.port=${SERVER_PORT:8080}

# Direct REST URLs for the four existing domain microservices.
defence.services.resource.url=${RESOURCE_SERVICE_URL:http://localhost:8081}
defence.services.logistics.url=${LOGISTICS_SERVICE_URL:http://localhost:8082}
defence.services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8083}
defence.services.maintenance.url=${MAINTENANCE_SERVICE_URL:http://localhost:8084}

# API paths are intentionally centralized in AdminController/MicroserviceClient.
# Match these paths to the existing microservices' controllers if your routes differ.
spring.thymeleaf.cache=false
spring.web.error.include-message=never
# server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Local persistent H2 database is used ONLY for web-app accounts and roles.
spring.datasource.url=${AUTH_DATABASE_URL:jdbc:h2:file:./data/defence-logistics-auth;AUTO_SERVER=TRUE}
spring.datasource.username=${AUTH_DATABASE_USERNAME:sa}
spring.datasource.password=${AUTH_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
