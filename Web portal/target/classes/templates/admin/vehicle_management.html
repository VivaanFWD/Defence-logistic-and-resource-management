<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Include the shared head fragment -->
<head th:replace="~{fragments/layout :: head('Vehicle Management - Defense Logistics')}"></head>

<body>
    <div class="d-flex">
        <!-- Include Sidebar Fragment, passing 'vehicles' as the active menu item -->
        <div th:replace="~{fragments/layout :: sidebar('vehicles')}"></div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 overflow-auto" style="height: 100vh;">
            
            <!-- Include Header Fragment -->
            <header th:replace="~{fragments/layout :: header('Vehicle Management', ${currentUser})}"></header>

            <div class="container-fluid px-4">
                
                <!-- Page Header with Action Button -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="mb-0 fw-bold text-dark">Vehicle Management</h5>
                    <a th:href="@{/admin/vehicles/add}" class="btn btn-primary btn-sm px-3">
                        <i class="bi bi-plus-lg me-1"></i> Add Vehicle
                    </a>
                </div>

                <!-- Vehicles Data Table Card -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="ps-4">ID</th>
                                        <th scope="col">Vehicle No</th>
                                        <th scope="col">Type</th>
                                        <th scope="col">Status</th>
                                        <th scope="col">Location</th>
                                        <th scope="col" class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic Thymeleaf Iteration over 'vehicleList' -->
                                    <tr th:each="vehicle : ${vehicleList}">
                                        <td class="ps-4 text-muted" th:text="${vehicle.id}">1</td>
                                        <td class="fw-medium" th:text="${vehicle.vehicleNo}">DEF-101</td>
                                        <td th:text="${vehicle.type}">Truck</td>
                                        <td>
                                            <!-- Dynamic Badge based on status -->
                                            <span class="badge rounded-pill" 
                                                  th:classappend="${vehicle.status == 'Available' ? 'badge-active' : (vehicle.status == 'In Use' ? 'bg-danger' : 'badge-maintenance')}"
                                                  th:text="${vehicle.status}">Available</span>
                                        </td>
                                        <td th:text="${vehicle.location}">Base-1</td>
                                        <td class="text-center">
                                            <a th:href="@{/admin/vehicles/edit/{id}(id=${vehicle.id})}" class="btn btn-primary btn-sm px-3">
                                                Edit
                                            </a>
                                        </td>
                                    </tr>
                                    
                                    <!-- Fallback static rows for UI testing if 'vehicleList' is null -->
                                    <tr th:if="${vehicleList == null}">
                                        <td class="ps-4 text-muted">1</td>
                                        <td class="fw-medium">DEF-101</td>
                                        <td>Truck</td>
                                        <td><span class="badge rounded-pill badge-active">Available</span></td>
                                        <td>Base-1</td>
                                        <td class="text-center"><button class="btn btn-primary btn-sm px-3">Edit</button></td>
                                    </tr>
                                    <tr th:if="${vehicleList == null}">
                                        <td class="ps-4 text-muted">2</td>
                                        <td class="fw-medium">DEF-102</td>
                                        <td>Jeep</td>
                                        <td><span class="badge rounded-pill bg-danger">In Use</span></td>
                                        <td>Field-A</td>
                                        <td class="text-center"><button class="btn btn-primary btn-sm px-3">Edit</button></td>
                                    </tr>
                                    <tr th:if="${vehicleList == null}">
                                        <td class="ps-4 text-muted">3</td>
                                        <td class="fw-medium">DEF-103</td>
                                        <td>Bus</td>
                                        <td><span class="badge rounded-pill badge-maintenance">Maintenance</span></td>
                                        <td>Workshop</td>
                                        <td class="text-center"><button class="btn btn-primary btn-sm px-3">Edit</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div> 
        </div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
