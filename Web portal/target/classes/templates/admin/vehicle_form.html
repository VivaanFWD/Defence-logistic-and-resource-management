<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Vehicle Details - Defence Logistics')}"></head><body><div class="d-flex"><div th:replace="~{fragments/layout :: sidebar('vehicles')}"></div><main class="flex-grow-1"><header th:replace="~{fragments/layout :: header(${formTitle}, ${currentUser})}"></header><div class="container px-4 pb-5"><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="@{/admin/vehicles/save}" method="post"><input type="hidden" name="id" th:value="${recordId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Vehicle number</label><input class="form-control" name="vehicleNo" required th:value="${record != null ? record.vehicleNo : ''}"></div><div class="col-md-6"><label class="form-label">Vehicle type</label><input class="form-control" name="type" required th:value="${record != null ? record.type : ''}"></div><div class="col-md-6"><label class="form-label">Location / Unit</label><input class="form-control" name="location" th:value="${record != null ? record.location : ''}"></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option>Available</option><option>In Use</option><option>Maintenance</option></select></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save to Resource_Service</button><a class="btn btn-outline-secondary" th:href="@{/vehicle_mgmnt}">Cancel</a></div></form></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
