
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admin Dashboard - Defense Logistics')}">
    <title>Admin Dashboard</title>
</head>

<body>

<div class="app-layout d-flex">

    <!-- Sidebar Fragment -->
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}">
    </aside>

    <!-- Main Content -->
    <main class="main-content flex-grow-1">

        <!-- Header Fragment -->
        <header th:replace="~{fragments/layout :: header('Dashboard', ${user})}">
        </header>

        <div class="container-fluid px-4 pb-4">

            <div th:if="${integrationNote}" class="alert alert-info py-2" th:text="${integrationNote}"></div>

            <!-- Primary Statistics -->
            <div class="row g-3 mb-4">

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">
                                <i class="bi bi-people me-2"></i>Total Users
                            </h6>
                            <div class="stat-value text-primary"
                                 th:text="${dashboardStats.totalUsers}">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">
                                <i class="bi bi-person-badge me-2"></i>Personnel
                            </h6>
                            <div class="stat-value text-success"
                                 th:text="${dashboardStats.totalPersonnel}">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">
                                <i class="bi bi-truck me-2"></i>Vehicles
                            </h6>
                            <div class="stat-value text-warning"
                                 th:text="${dashboardStats.totalVehicles}">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">
                                <i class="bi bi-tools me-2"></i>Equipment
                            </h6>
                            <div class="stat-value text-info"
                                 th:text="${dashboardStats.totalEquipment}">0</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Secondary Statistics -->
            <div class="row g-3 mb-4">

                <div class="col-12 col-md-4">
                    <div class="card stat-card bg-light h-100">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">
                                <i class="bi bi-box-seam me-2"></i>Inventory Items
                            </h6>
                            <span class="fs-4 fw-bold"
                                  th:text="${dashboardStats.inventoryItems}">0</span>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card stat-card bg-light h-100">
                        <div class="card-body">
                            <h6 class="text-danger mb-2">
                                <i class="bi bi-clipboard-check me-2"></i>Active Requests
                            </h6>
                            <span class="fs-4 fw-bold text-danger"
                                  th:text="${dashboardStats.activeRequests}">0</span>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card stat-card bg-light h-100">
                        <div class="card-body">
                            <h6 class="text-warning mb-2">
                                <i class="bi bi-wrench-adjustable me-2"></i>Under Maintenance
                            </h6>
                            <span class="fs-4 fw-bold text-warning"
                                  th:text="${dashboardStats.underMaintenance}">0</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Recent Activities -->
            <div class="card shadow-sm border-0">

                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-bold">
                        <i class="bi bi-clock-history me-2"></i>
                        Recent Activities
                    </h6>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">

                        <table class="table table-hover mb-0">

                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Activity</th>
                                    <th>User</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="activity : ${recentActivities}">
                                    <td th:text="${#temporals.format(activity.date, 'dd-MM-yyyy')}">
                                        10-06-2025
                                    </td>

                                    <td th:text="${activity.description}">
                                        Activity description
                                    </td>

                                    <td th:text="${activity.performedBy}">
                                        Username
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(recentActivities)}">
                                    <td colspan="3"
                                        class="text-center text-muted py-4">
                                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                                        No recent activities found.
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="text-center text-muted small mt-4">
                Defense Logistics Management System
            </footer>

        </div>
    </main>

</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
