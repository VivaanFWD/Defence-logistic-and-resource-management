<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Include the shared head fragment -->
<head th:replace="~{fragments/layout :: head('Inventory Management - Defense Logistics')}"></head>

<body>
    <div class="d-flex">
        <!-- Include Sidebar Fragment, passing 'inventory' as the active menu item -->
        <div th:replace="~{fragments/layout :: sidebar('inventory')}"></div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 overflow-auto" style="height: 100vh;">
            
            <!-- Include Header Fragment -->
            <header th:replace="~{fragments/layout :: header('Inventory Management', ${currentUser})}"></header>

            <div class="container-fluid px-4">
                
                <!-- Page Header (No add button in the provided mock, but keeping layout consistent) -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="mb-0 fw-bold text-dark">Inventory Management</h5>
                </div>

                <!-- Inventory Data Table Card -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="ps-4">ID</th>
                                        <th scope="col">Item Name</th>
                                        <th scope="col">Category</th>
                                        <th scope="col">Stock</th>
                                        <th scope="col">Reorder Level</th>
                                        <th scope="col" class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic Thymeleaf Iteration over 'inventoryList' -->
                                    <tr th:each="item : ${inventoryList}">
                                        <td class="ps-4 text-muted" th:text="${item.id}">1</td>
                                        <td class="fw-medium" th:text="${item.itemName}">Fuel (Diesel)</td>
                                        <td th:text="${item.category}">Fuel</td>
                                        <!-- Highlight stock if it falls below reorder level -->
                                        <td th:classappend="${item.stock <= item.reorderLevel} ? 'text-danger fw-bold' : ''" 
                                            th:text="${item.stock}">5000 L</td>
                                        <td class="text-muted" th:text="${item.reorderLevel}">1000 L</td>
                                        <td class="text-center">
                                            <a th:href="@{/admin/inventory/edit/{id}(id=${item.id})}" class="btn btn-primary btn-sm">
                                                Edit
                                            </a>
                                        </td>
                                    </tr>
                                    
                                    <!-- Fallback static rows matching image.png for visual testing -->
                                    <tr th:if="${inventoryList == null}">
                                        <td class="ps-4 text-muted">1</td>
                                        <td class="fw-medium">Fuel (Diesel)</td>
                                        <td>Fuel</td>
                                        <td>5000 L</td>
                                        <td class="text-muted">1000 L</td>
                                        <td class="text-center"><button class="btn btn-primary btn-sm px-3">Edit</button></td>
                                    </tr>
                                    <tr th:if="${inventoryList == null}">
                                        <td class="ps-4 text-muted">2</td>
                                        <td class="fw-medium">Spare Tyre</td>
                                        <td>Spare</td>
                                        <td>50</td>
                                        <td class="text-muted">10</td>
                                        <td class="text-center"><button class="btn btn-primary btn-sm px-3">Edit</button></td>
                                    </tr>
                                    <tr th:if="${inventoryList == null}">
                                        <td class="ps-4 text-muted">3</td>
                                        <td class="fw-medium">Medical Kit</td>
                                        <td>Medical</td>
                                        <td>200</td>
                                        <td class="text-muted">50</td>
                                        <td class="text-center"><button class="btn btn-primary btn-sm px-3">Edit</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div> 
        </div> 
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
