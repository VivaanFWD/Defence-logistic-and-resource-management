<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Inventory Item - Defence Logistics')}"></head><body><div class="d-flex"><div th:replace="~{fragments/layout :: sidebar('inventory')}"></div><main class="flex-grow-1"><header th:replace="~{fragments/layout :: header('Edit Inventory Item', ${currentUser})}"></header><div class="container px-4 pb-5"><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="@{/admin/inventory/save}" method="post"><input type="hidden" name="id" th:value="${recordId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Item name</label><input class="form-control" name="itemName" required th:value="${record != null ? record.itemName : ''}"></div><div class="col-md-6"><label class="form-label">Category</label><input class="form-control" name="category" required th:value="${record != null ? record.category : ''}"></div><div class="col-md-6"><label class="form-label">Stock quantity</label><input class="form-control" name="stock" type="number" min="0" required th:value="${record != null ? record.stock : ''}"></div><div class="col-md-6"><label class="form-label">Reorder level</label><input class="form-control" name="reorderLevel" type="number" min="0" required th:value="${record != null ? record.reorderLevel : ''}"></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save to Inventory_Service</button><a class="btn btn-outline-secondary" th:href="@{/admin/inventory}">Cancel</a></div></form></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
