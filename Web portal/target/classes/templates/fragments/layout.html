
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Defense Logistics</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Spring Boot static CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <script th:src="@{/script/script.js}" defer></script>
</head>

<body>

    <!-- SIDEBAR FRAGMENT -->
    <aside th:fragment="sidebar(activeMenu)"
           class="sidebar d-flex flex-column flex-shrink-0 p-3">

        <a th:href="@{/admin/dashboard}" th:if="${currentUser != null and currentUser.role == 'ADMIN'}"
           class="navbar-brand text-decoration-none d-flex align-items-center mb-4">

            <i class="bi bi-shield-shaded me-2 fs-4"></i>
            <span>Defense Logistics</span>
        </a>

        <a th:if="${currentUser != null and currentUser.role != 'ADMIN'}"
           th:href="${currentUser.role == 'LOGISTIC_OFFICER' ? '/logistics/dashboard' : '/requester/dashboard'}"
           class="navbar-brand text-decoration-none d-flex align-items-center mb-4">
            <i class="bi bi-shield-shaded me-2 fs-4"></i><span>Defense Logistics</span>
        </a>

        <ul class="nav nav-pills flex-column mb-auto">

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/dashboard}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''">

                    <i class="bi bi-speedometer2 me-2"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/accounts}" class="nav-link" th:classappend="${activeMenu == 'accounts'} ? ' active' : ''">
                    <i class="bi bi-shield-lock me-2"></i>Authentication Accounts
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/users}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'users'} ? ' active' : ''">

                    <i class="bi bi-people me-2"></i>
                    User Management
                </a>
            </li>

            
            <!-- Vehicles -->
            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/vehicle_mgmnt}"
                class="nav-link"
                th:classappend="${activeMenu == 'vehicles'} ? ' active' : ''">
                    <i class="bi bi-truck me-2"></i>
                    Vehicles
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/equipment}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'equipment'} ? ' active' : ''">

                    <i class="bi bi-tools me-2"></i>
                    Equipment
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/maintenance}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'maintenance'} ? ' active' : ''">
                    <i class="bi bi-wrench-adjustable-circle me-2"></i>
                    Maintenance
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/roles}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'roles'} ? ' active' : ''">
                    <i class="bi bi-person-lock me-2"></i>
                    User Types & Roles
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/inventory}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'inventory'} ? ' active' : ''">

                    <i class="bi bi-box-seam me-2"></i>
                    Inventory
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'LOGISTIC_OFFICER')}">
                <a th:href="@{/logistics/dashboard}"
                   class="nav-link">
                    <i class="bi bi-diagram-3 me-2"></i>
                    Logistics Operations
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'QUARTERMASTER')}">
                <a th:href="@{/requester/dashboard}"
                   class="nav-link">
                    <i class="bi bi-clipboard-data me-2"></i>
                    Unit Requests
                </a>
            </li>

            <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/requests}"
                   class="nav-link"
                   th:classappend="${activeMenu == 'requests'} ? ' active' : ''">

                    <i class="bi bi-clipboard-check me-2"></i>
                    Requests
                </a>
            </li>

        </ul>

        <hr>

        <div class="small text-secondary">
            Defense Logistics Management
        </div>
    </aside>


    <!-- HEADER FRAGMENT -->
    
<!-- HEADER FRAGMENT -->
<header th:fragment="header(pageTitle, currentUser)"
        class="topbar bg-white shadow-sm d-flex
               justify-content-between align-items-center p-3 mb-4">

    <div class="d-flex flex-column flex-grow-1">
      <h4 class="mb-0" th:text="${pageTitle}">Page Title</h4>
      <div th:if="${success}" class="alert alert-success py-2 mt-2 mb-0 me-3" role="alert" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger py-2 mt-2 mb-0 me-3" role="alert" th:text="${error}"></div>
    </div>

    <div class="dropdown">
        <button class="btn btn-light dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">

            <i class="bi bi-person-circle me-1"></i>

            <!-- Display username safely -->
            <span th:if="${currentUser != null}"
                  th:text="${currentUser.username}">
                Admin
            </span>

            <span th:unless="${currentUser != null}">
                Guest
            </span>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
            <li>
                <a class="dropdown-item" th:href="@{/profile}">
                    <i class="bi bi-person me-2"></i>
                    Profile
                </a>
            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <li>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="dropdown-item">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Logout
                    </button>
                </form>
            </li>
        </ul>
    </div>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
